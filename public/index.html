<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width"
  >
  <title>Pokémon Ratings</title>

  <!-- Pokemon Font via https://www.cdnfonts.com/pokemon-solid.font -->
  <link
    href="https://fonts.cdnfonts.com/css/pokemon-solid"
    rel="stylesheet"
  >

  <!-- Dom Purify library helps to Sanitize dynamic HTML strings.-->
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"
    integrity="sha256-QM/0krVDU6Vc35/7NpeGU5/7fVTSX5fdSh6JdbMJw10="
    crossorigin="anonymous"
  ></script>

  <!-- Twentieth Century font via Monotype.com --->
  <link
    href="https://cdn.fonts.net/kit/7b6b1e00-8b68-11ec-9ce3-0220834439f4/7b6b1e00-8b68-11ec-9ce3-0220834439f4.css"
    rel="stylesheet"
  />

  <link
    href="style.css"
    rel="stylesheet"
    type="text/css"
  />
  <!-- Use a Pokemon Coloured Base64 Pixel as Favicon. see also: https://png-pixel.com/ -->
  <link
    href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mN8HxzwHwAGXgKT5yJ2+AAAAABJRU5ErkJggg=="
    rel="icon"
    type="image/x-icon"
  >
</head>

<body>
  <header>
    <div class="header-brand">
      <h1>Pokémon Ratings</h1>
      <img src="pokeball.svg" alt="">
    </div>
    <div class="visitor" hidden>
      <span id="visitor-name"></span>
      <button id="logout" type="button"><span>Logout</span></button>
    </div>
  </header>
  <dialog id="name-dialog" aria-labelledby="name-title">
    <form id="name-form">
      <h2 id="name-title"><img src="pokeball.svg" alt="">Welcome, Pokéfan</h2>
      <p style="text-wrap: balance;">To share your ratings with the community, please introduce yourself.</p>
      <label for="name-input">Your Name:</label>
      <input id="name-input" type="text" placeholder="Pokéfan" autocomplete="nickname" maxlength="40" required autofocus>

      <div class="dialog-actions">
        <button type="submit">Continue</button>
      </div>
    </form>
  </dialog>
  <nav aria-label="Pokémon categories"></nav>
  <main></main>
  <footer>
    <p>Pokémon data comes from <a href="https://pokeapi.co">PokeAPI</a>. Ratings are saved in MongoDB.</p>
  </footer>
  <script
    src="main.js"
    type="module"
  ></script>
</body>

</html>
